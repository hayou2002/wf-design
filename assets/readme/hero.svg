  <g font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <rect x="632" y="96" width="240" height="70" rx="16" fill="#FFFFFF" stroke="#F0D8E0"/>
