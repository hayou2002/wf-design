<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">wf-design 工作流示意</title>
  <desc id="hero-desc">先按类型调用内置 SOP,再从网页、文档、图片、正式文件四条车道里选一条,交付前自检。</desc>
  <rect width="1200" height="340" rx="24" fill="#FDF8FA"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#F2DDE4"/>
  <rect x="72" y="56" width="196" height="30" rx="15" fill="#FBE3EA"/>
  <text x="88" y="77" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16" letter-spacing="2" fill="#BE3A62">WORKFLOW SKILL</text>
  <text x="70" y="150" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="700" fill="#20131A">wf-design</text>
  <text x="72" y="196" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#7A5B68">从「想要好看」到能交付</text>
  <text x="72" y="242" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#957683">问清给谁看 · 选对工具 · 做完能自己判断</text>
  <text x="72" y="272" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#957683">一次只走一条车道,用不上的技能不硬凑</text>

  <g font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="632" y="84" font-size="18" fill="#957683">先按类型调 SOP,再从四条车道选一条</text>

    <rect x="632" y="104" width="240" height="70" rx="16" fill="#FFFFFF" stroke="#F0D8E0"/>
    <circle cx="660" cy="139" r="8" fill="#D6486F"/>
    <text x="684" y="146" font-size="20" fill="#3A2A31">网页与界面</text>

    <rect x="888" y="104" width="244" height="70" rx="16" fill="#FFFFFF" stroke="#F0D8E0"/>
    <circle cx="916" cy="139" r="8" fill="#7C5CFF"/>
    <text x="940" y="146" font-size="20" fill="#3A2A31">文档与演示</text>

    <rect x="632" y="188" width="240" height="70" rx="16" fill="#FFFFFF" stroke="#F0D8E0"/>
    <circle cx="660" cy="223" r="8" fill="#E9A13B"/>
    <text x="684" y="230" font-size="20" fill="#3A2A31">图片与图标</text>

    <rect x="888" y="188" width="244" height="70" rx="16" fill="#FFFFFF" stroke="#F0D8E0"/>
    <circle cx="916" cy="223" r="8" fill="#2F8F7A"/>
    <text x="940" y="230" font-size="20" fill="#3A2A31">正式文件</text>

    <rect x="632" y="278" width="60" height="12" rx="6" fill="#D6486F"/>
    <rect x="700" y="278" width="60" height="12" rx="6" fill="#7C5CFF"/>
    <rect x="768" y="278" width="60" height="12" rx="6" fill="#E9A13B"/>
    <rect x="836" y="278" width="60" height="12" rx="6" fill="#2F8F7A"/>
    <text x="912" y="289" font-size="18" fill="#957683">一条车道配一套色</text>
  </g>
</svg>
